[project]
name = "mycli"
version = "0.1.0"
description = "A CLI tool"
requires-python = ">=3.14"
dependencies = [
    "click~=8.5",
    "requests~=2.34",
    "truststore~=0.10",
]

[project.scripts]
mycli = "mycli.cli:main"

[project.optional-dependencies]
dev = [
    "types-requests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mycli"]

[tool.basedpyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"